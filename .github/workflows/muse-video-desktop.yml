name: Muse desktop bridge checks
on:
  push:
    branches: [feat/muse-video-desktop-bridge]
    paths:
      - "tools/muse-video-desktop/**"
      - ".github/workflows/muse-video-desktop.yml"
  pull_request:
    paths:
      - "tools/muse-video-desktop/**"
      - ".github/workflows/muse-video-desktop.yml"
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/muse-video-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check and test
        run: npm test
      - name: Build
        run: npm run build
